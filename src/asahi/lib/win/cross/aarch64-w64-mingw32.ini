#
# Meson cross file: Windows on ARM64 (aarch64-w64-mingw32), llvm-mingw style
# toolchain (clang + lld in MinGW mode, mingw-w64 headers and CRT, UCRT).
# The tool names assume the llvm-mingw driver wrappers are on PATH; with a
# plain LLVM install use the [constants] block instead (see README.md).
#
# Use together with build-machine.ini (host-built mesa_clc, vtn_bindgen2,
# asahi_clc and glslangValidator). See README.md for the full command line.

[constants]
triple = 'aarch64-w64-mingw32'

[binaries]
c = triple + '-clang'
cpp = triple + '-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
windres = 'llvm-windres'
rc = 'llvm-rc'
dlltool = 'llvm-dlltool'
# No target pkg-config: every target dependency is either disabled or a
# subproject (and wraps are not downloaded, see README.md).
pkg-config = 'false'
# No exe_wrapper: meson >= 1.10 runs it for the compiler sanity check, and
# with needs_exe_wrapper = true and no wrapper it skips running instead.

[built-in options]
# -mno-ms-bitfields: mingw targets default to the MSVC bit-field layout, which
# breaks the PACKED bit-field structs of asahi (agx_index, hk_tess_info,
# agx_fs_epilog_link_info; their static_asserts fire). Structs that cross to
# the clang-cl built kernel driver must therefore not use bit-fields.
c_args = ['-D_WIN32_WINNT=0x0A00', '-DWINVER=0x0A00', '-mno-ms-bitfields']
cpp_args = ['-D_WIN32_WINNT=0x0A00', '-DWINVER=0x0A00', '-mno-ms-bitfields']
# --no-insert-timestamp: no link time in the PE and debug-directory headers,
# so two builds of the same tree give the same DLL.
c_link_args = ['-static-libgcc', '-Wl,--no-insert-timestamp']
cpp_link_args = ['-static-libgcc', '-static-libstdc++', '-Wl,--no-insert-timestamp']

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'armv8.2-a'
endian = 'little'
