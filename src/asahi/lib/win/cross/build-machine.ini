#
# Meson native file for the Windows cross build: the build-machine tools that
# run during the build. mesa_clc and vtn_bindgen2 come from a native Mesa
# build with -Dmesa-clc=enabled -Dinstall-mesa-clc=true, asahi_clc from the
# same build with -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true
# (gallium-drivers=asahi or tools=asahi).
#
# The install location comes from a constant defined in a native file given
# BEFORE this one on the command line, e.g. tools-path.ini:
#   [constants]
#   native_tools = '/absolute/prefix/of/the/native/build/bin'

[binaries]
mesa_clc = native_tools / 'mesa_clc'
vtn_bindgen2 = native_tools / 'vtn_bindgen2'
asahi_clc = native_tools / 'asahi_clc'
glslangValidator = 'glslangValidator'
python = 'python3'
